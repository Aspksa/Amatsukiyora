<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amatsukiyora · Cognitive Universe</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="universe.css"></head>
