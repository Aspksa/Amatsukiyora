<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amatsukiyora</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>AMATSUKIYORA</h1><span id="status" role="status">Подключение…</span></header>
<section class="map-panel"><div class="map-heading"><div><h2>Граф связей</h2><small>Маршруты знаний · реальные связи</small></div><button id="metro-reset">1:1</button></div><svg id="metro" viewBox="-500 -500 1000 1000" aria-label="Граф связей"></svg><div id="legend" class="legend"></div><p id="graph-status" role="status"></p></section>
<section class="map-panel"><div class="map-heading"><div><h2>Мозг</h2><small>Радиальная карта памяти</small></div><button id="reset">1:1</button></div><svg id="brain" viewBox="-500 -500 1000 1000" aria-label="Карта памяти"></svg></section>
<aside><div><h2>Память</h2><form id="add"><select id="category"><option>Знания</option><option>Навыки</option><option>Опыт</option><option>Личность</option></select><input id="label" required maxlength="200" placeholder="Новая запись"><button>Добавить</button></form></div>
<div><h2>Связать записи</h2><form id="link-form"><select id="from" aria-label="Первая запись" required></select><select id="to" aria-label="Вторая запись" required></select><button>Создать связь</button></form><p id="link-status" role="status"></p></div><div><h2>Выбранный узел</h2><p id="detail">Выберите узел</p></div></aside></main>
<script type="module" src="metro.js"></script><script type="module" src="brain.js"></script></body></html>
