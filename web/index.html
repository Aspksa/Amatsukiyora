<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amatsukiyora · Карта знаний</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Cg fill=%27none%27 stroke=%27%2363e5df%27 stroke-width=%272%27%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2715%27/%3E%3Cellipse cx=%2720%27 cy=%2720%27 rx=%279%27 ry=%2716%27 transform=%27rotate(42 20 20)%27/%3E%3C/g%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%273%27 fill=%27%2363e5df%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="universe.css">
</head>
<body>
<main class="universe">
  <section class="map-panel" aria-label="Карта знаний">
    <p id="map-status" class="sr-only" role="status"></p>
    <svg id="universe" tabindex="0" viewBox="-540 -540 1080 1080" aria-label="Радиальная карта знаний и документов">
      <defs>
        <radialGradient id="core-light">
          <stop stop-color="#102329"/><stop offset=".8" stop-color="#0c1b22"/><stop offset="1" stop-color="#08151c"/>
        </radialGradient>
        <radialGradient id="orbit-nebula">
          <stop stop-color="#22434e" stop-opacity=".12"/><stop offset=".63" stop-color="#1e3b48" stop-opacity=".10"/><stop offset="1" stop-color="#122c38" stop-opacity="0"/>
        </radialGradient>
      </defs>
    </svg>
  </section>
  <aside class="map-chat" aria-labelledby="chat-title">
    <div class="chat-heading">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13"/><ellipse cx="16" cy="16" rx="7.5" ry="13" transform="rotate(42 16 16)"/><circle cx="16" cy="16" r="2.4"/>
      </svg>
      <div><h1 id="chat-title">Чат карты</h1><span id="chat-source">Локальные данные</span></div>
    </div>
    <div id="chat-history" class="chat-history" role="log" aria-label="Сообщения чата" tabindex="0"></div>
    <form id="chat-form" class="chat-form">
      <label class="sr-only" for="chat-input">Вопрос или поисковая фраза</label>
      <input id="chat-input" type="text" maxlength="200" placeholder="Спросить или найти…" required>
      <button type="submit">Отправить</button>
    </form>
  </aside>
</main>
<script type="module" src="universe.js"></script>
</body>
</html>
