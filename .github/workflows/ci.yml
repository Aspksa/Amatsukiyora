name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python launch.py --check
      - if: runner.os == 'Windows'
        shell: cmd
        run: call start.bat --check
      - run: npm install --global typescript@5.9.3
      - run: tsc -p tsconfig.json
      - run: git diff --exit-code --ignore-space-at-eol -- web/brain.js
      - run: tsc --allowJs --checkJs --noEmit --target ES2020 --module ES2020 web/metro.js
      - run: python -m unittest discover -s tests
